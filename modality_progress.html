<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抓取实验 · 实时进度</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#e9edf6;background:#101520}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:0 auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:12px;letter-spacing:2px;color:#7f95b4}h1{font-size:30px;margin:12px 0}p{color:#9aa9bd;font-size:14px;line-height:1.7}.live{font-size:12px;color:#70d7b1;white-space:nowrap}.summary{display:flex;gap:36px;margin:28px 0;padding:22px 26px;border:1px solid #2a3547;border-radius:14px;background:#161e2c}.summary strong{font-size:26px;display:block;margin-bottom:7px}.summary span{font-size:12px;color:#9aa9bd}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#192232;border:1px solid #2c384c;border-radius:16px;padding:24px;min-width:0}.card h2{font-size:19px;margin:0 0 12px}.tag{font-size:11px;background:#263b46;color:#80ddbd;padding:6px 9px;border-radius:6px;display:inline-block}.percent{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 9px}.percent strong{font-size:32px;font-variant-numeric:tabular-nums}.muted{color:#9aa9bd;font-size:12px}.bar{height:8px;background:#303b4d;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#47b8ac,#8ae3c5);transition:width .5s}.detail{font-size:12px;line-height:1.8;color:#9aa9bd;margin:12px 0 22px;min-height:44px}.metrics{display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid #303b4d}.metrics b{display:block;font-size:18px;margin-top:7px}.eval{border-top:1px solid #303b4d;padding-top:18px}.row{display:flex;justify-content:space-between;font-size:12px;margin:14px 0 7px}.small{height:4px}.error{color:#ffb394;overflow-wrap:anywhere}.foot{margin-top:26px;font-size:12px}#notice{color:#ffb394}svg{display:block;width:100%;height:52px;margin-bottom:16px} @media(max-width:850px){.cards{grid-template-columns:1fr}header{align-items:start;flex-direction:column}main{padding-top:28px}.summary{gap:24px;flex-wrap:wrap}}
</style></head><body><main>
<header><div><div class="eyebrow">GRASPNET · MODALITY STUDY</div><h1>抓取实验进度</h1><p>从实验记录读取训练、验证和测试进度</p></div><div class="live" id="live">正在连接…</div></header>
<div id="notice" role="status"></div><section class="summary" id="summary"></section><section class="cards" id="cards"></section>
<p class="foot">每 5 秒刷新。训练进度按批次统计；测试进度按已完成的条件统计（每组 11 项）。<br>验证匹配率用于选择权重，不是最终测试成绩。页面只读取记录；运行顺序由实验队列决定。时间均为北京时间。</p>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(2)+'%';
function bar(v,small=false){return `<div class="bar ${small?'small':''}" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${v}%"></div></div>`}
function chart(h){if(!h.length)return '<svg aria-label="尚无验证记录"></svg>';let pts=h.map((v,i)=>`${i*260/Math.max(1,h.length-1)},${48-v.val_accuracy*44}`).join(' ');return `<svg viewBox="0 0 260 52" role="img" aria-label="历轮验证匹配率"><polyline points="${pts}" fill="none" stroke="#77d8bc" stroke-width="2"/></svg>`}
async function refresh(){try{const r=await fetch('/status.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();document.getElementById('live').textContent='● 实时更新 · '+s.updated;document.getElementById('notice').textContent='';
document.getElementById('summary').innerHTML=`<div><strong>${s.jobs.filter(j=>j.completed>=j.total).length} / ${s.jobs.length}</strong><span>训练已完成</span></div><div><strong>${s.jobs.reduce((n,j)=>n+j.evaluations.filter(e=>e.done).length,0)} / ${s.jobs.length*3}</strong><span>测试集已完成</span></div><div><strong>${s.jobs.reduce((n,j)=>n+j.completed,0)} / ${s.jobs.reduce((n,j)=>n+j.total,0)}</strong><span>已保存训练轮次</span></div>`;
document.getElementById('cards').innerHTML=s.jobs.map(j=>{let last=j.history.at(-1);return `<article class="card"><h2>${esc(j.label)}</h2><span class="tag">${esc(j.stage)}</span><div class="percent"><strong>${j.percent.toFixed(1)}%</strong><span class="muted">训练进度</span></div>${bar(j.percent)}<div class="detail">${j.epoch?`第 ${j.epoch} / ${j.total} 轮 · 批次 ${j.batch} / ${j.batches}`:'等待训练开始'}<br>${j.age==null?'尚未开始':`最近记录：${j.age} 秒前`} · ${esc(j.device).toUpperCase()}</div><div class="metrics"><div><span class="muted">最新验证匹配率</span><b>${pct(last?.val_accuracy)}</b></div><div><span class="muted">训练损失</span><b>${last?last.train_loss.toFixed(4):'—'}</b></div></div>${chart(j.history)}<div class="eval"><span class="muted">测试进度 / 正常图匹配率</span>${j.evaluations.map(e=>`<div class="row"><span>${esc(e.title)}</span><span>${e.done?pct(e.clean):e.conditions+' / 11 条件'}</span></div>${bar(e.conditions/11*100,true)}`).join('')}</div>${j.error?`<p class="error">${esc(j.error)}</p>`:''}</article>`}).join('');
}catch(e){document.getElementById('live').textContent='连接中断';document.getElementById('notice').textContent='无法连接本地进度服务；显示的是上次读取的记录。正在重试。'}finally{setTimeout(refresh,5000)}}refresh();
</script></body></html>
